name: deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Un seul déploiement à la fois par environnement : un second push attend
# la fin du premier au lieu de lancer deux kubectl apply concurrents.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

# Permissions minimales par défaut ; id-token n'est accordé qu'au job deploy.
permissions:
  contents: read

env:
  IMAGE_NAME: demo-app

jobs:
  # Aucun accès Azure dans ce job : build et scan se font sur du code non
  # encore validé, sans token capable de pousser ou de déployer.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" app/

      # Épinglé >= v0.35.0 : tous les tags antérieurs ont été réécrits lors
      # de la compromission de mars 2026. Ne jamais redescendre.
      - name: Scan Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Export image
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Le subject OIDC fédéré côté Azure est repo:<owner>/<repo>:environment:dev.
    # Un job sans cet environnement ne peut pas obtenir de token Azure.
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push ACR
        id: push
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          LOGIN_SERVER=$(az acr show --name "${{ vars.ACR_NAME }}" --query loginServer -o tsv)
          IMAGE="${LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker load -i image.tar
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE}"
          docker push "${IMAGE}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Render manifest
        working-directory: k8s
        run: sed -i "s|IMAGE_PLACEHOLDER|${{ steps.push.outputs.image }}|" deployment.yaml

      # Le runner hébergé n'a pas de route vers l'API server privé :
      # command invoke fait exécuter kubectl par un pod éphémère dans le
      # cluster, avec le token Entra de l'identité CI (RBAC Writer sur le
      # namespace uniquement).
      #
      # command invoke renvoie 0 même si la commande distante échoue : le
      # vrai code de retour est dans .exitCode du JSON.
      - name: Deploy (az aks command invoke)
        working-directory: k8s
        run: |
          RESULT=$(az aks command invoke \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --file deployment.yaml \
            --command "kubectl apply -f deployment.yaml && kubectl rollout status deployment/demo-app -n ${{ vars.APP_NAMESPACE }} --timeout=180s" \
            -o json)
          echo "${RESULT}" | jq -r '.logs'
          EXIT_CODE=$(echo "${RESULT}" | jq -r '.exitCode')
          echo "Remote exit code: ${EXIT_CODE}"
          test "${EXIT_CODE}" = "0"
