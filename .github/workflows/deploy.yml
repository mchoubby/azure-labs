name: deploy

on:
  push:
    branches: [main]
    # Seul un changement d'image justifie un build. Les manifestes k8s/ sont
    # réconciliés par Flux directement depuis Git, sans passer par la CI.
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Un seul déploiement à la fois par environnement : un second run attend la
# fin du premier au lieu de produire deux commits d'image concurrents.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

# Permissions minimales par défaut ; id-token et contents: write ne sont
# accordés qu'au job deploy.
permissions:
  contents: read

env:
  IMAGE_NAME: demo-app

jobs:
  # Aucun accès Azure dans ce job : build et scan se font sur du code non
  # encore validé, sans token capable de pousser ou de déployer.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" app/

      # Épinglé >= v0.35.0 : tous les tags antérieurs ont été réécrits lors
      # de la compromission de mars 2026. Ne jamais redescendre.
      - name: Scan Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Export image
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  # CI uniquement : publie l'image puis déclare la version voulue dans Git.
  # Le déploiement lui-même est fait par Flux (modèle pull) : cette identité
  # n'a aucun droit Kubernetes, seulement la lecture de l'état Flux via ARM.
  deploy:
    needs: build
    # Flux suit main : publier un digest depuis une autre branche n'aurait
    # aucun effet (ou écraserait main).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Le subject OIDC fédéré côté Azure est repo:<owner>/<repo>:environment:dev.
    # Un job sans cet environnement ne peut pas obtenir de token Azure.
    environment: dev
    permissions:
      # Commit du nouveau digest dans k8s/app/kustomization.yaml. Un push
      # fait avec GITHUB_TOKEN ne déclenche aucun workflow : pas de boucle.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Le digest (sha256 du manifeste) est la seule référence immuable : un
      # tag peut être repoussé, le digest garantit que Flux déploie
      # exactement l'image scannée par Trivy dans le job build.
      - name: Push ACR
        id: push
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          LOGIN_SERVER=$(az acr show --name "${{ vars.ACR_NAME }}" --query loginServer -o tsv)
          IMAGE="${LOGIN_SERVER}/${IMAGE_NAME}"
          docker load -i image.tar
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}" | cut -d@ -f2)
          test -n "${DIGEST}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      # yq plutôt que `kustomize edit set image` : préserve les commentaires
      # du fichier. Retry avec rebase si main a bougé pendant le run.
      - name: Commit image digest (GitOps)
        id: commit
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          update() {
            yq -i '(.images[] | select(.name == "demo-app")) |= (.newName = strenv(IMAGE) | .digest = strenv(DIGEST))' \
              k8s/app/kustomization.yaml
          }

          update
          if git diff --quiet; then
            echo "Digest déjà déclaré dans Git, rien à commiter."
          else
            git add k8s/app/kustomization.yaml
            git commit -m "deploy(demo-app): ${DIGEST} (${GITHUB_SHA::7})"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "${attempt}" -lt 3
              git pull --rebase origin main
            done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      # Retour de déploiement sans accès au cluster : l'extension Flux
      # remonte dans ARM le commit synchronisé et l'état de conformité.
      # La Kustomization "app" a wait=true, donc Compliant implique que le
      # rollout est terminé et les pods Ready.
      - name: Wait for Flux reconciliation
        env:
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          az extension add --name k8s-configuration --upgrade --only-show-errors
          for i in $(seq 1 60); do
            CONFIG=$(az k8s-configuration flux show \
              --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
              --cluster-name "${{ vars.AKS_CLUSTER_NAME }}" \
              --cluster-type managedClusters \
              --name "${{ vars.FLUX_CONFIGURATION_NAME }}" -o json)
            SYNCED=$(echo "${CONFIG}" | jq -r '.sourceSyncedCommitId // ""')
            STATE=$(echo "${CONFIG}" | jq -r '.complianceState // ""')
            echo "[${i}] commit=${SYNCED} state=${STATE}"
            if [[ "${SYNCED}" == *"${EXPECTED_SHA}"* && "${STATE}" == "Compliant" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Flux n'a pas convergé sur ${EXPECTED_SHA} :"
          echo "${CONFIG}" | jq '.statuses'
          exit 1