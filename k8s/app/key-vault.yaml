apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
  namespace: demo-app
  annotations:
    azure.workload.identity/client-id: WORKLOAD_IDENTITY_CLIENT_ID_PLACEHOLDER
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: demo-app-key-vault
  namespace: demo-app
spec:
  provider: azure
  parameters:
    clientID: WORKLOAD_IDENTITY_CLIENT_ID_PLACEHOLDER
    keyvaultName: KEY_VAULT_NAME_PLACEHOLDER
    tenantId: TENANT_ID_PLACEHOLDER
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    objects: |
      array:
        - |
          objectName: KEY_VAULT_SECRET_NAME_PLACEHOLDER
          objectType: secret
          objectAlias: api-key
