apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
  namespace: demo-app
  annotations:
    azure.workload.identity/client-id: ${WORKLOAD_IDENTITY_CLIENT_ID}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: demo-app-key-vault
  namespace: demo-app
spec:
  provider: azure
  parameters:
    clientID: ${WORKLOAD_IDENTITY_CLIENT_ID}
    keyvaultName: ${KEY_VAULT_NAME}
    tenantId: ${TENANT_ID}
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    objects: |
      array:
        - |
          objectName: ${KEY_VAULT_SECRET_NAME}
          objectType: secret
          objectAlias: api-key
