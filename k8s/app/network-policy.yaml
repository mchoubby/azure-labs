# Flux entrants autorisés vers demo-app. Déployé par la CI avec l'appli :
# c'est l'application qui déclare qui peut l'appeler.
# Pas encore d'ingress controller : seuls les pods du namespace y accèdent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-app-ingress
  namespace: demo-app
spec:
  podSelector:
    matchLabels:
      app: demo-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
