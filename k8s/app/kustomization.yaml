# Réconcilié par la Kustomization Flux "app" (modules/gitops), après
# "platform". Les variables ${...} sont substituées par Flux (postBuild) à
# partir des valeurs fournies par Terraform.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - key-vault.yaml
  - deployment.yaml
  - network-policy.yaml
  - hpa.yaml
  - pdb.yaml
# Mis à jour par la CI (kustomize edit set image) à chaque build : référence
# par digest, immuable, contrairement à un tag.
images:
  - name: demo-app
    newName: acraksdemodeva3b521.azurecr.io/demo-app
    digest: sha256:c5f033407e1a8ccda148946852aaa50e52a5b033956d1805f911e9e4e0c776a4
