apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-app-from-agc
  namespace: demo-app
spec:
  podSelector:
    matchLabels:
      app: demo-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: "${ALB_SUBNET_CIDR}"
      ports:
        - protocol: TCP
          port: 8080
