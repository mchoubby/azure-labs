apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-http-redirect
  namespace: demo-app
spec:
  parentRefs:
    - name: demo-ingress
      sectionName: http
  hostnames:
    - "${ALB_FQDN}"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-https
  namespace: demo-app
spec:
  parentRefs:
    - name: demo-ingress
      sectionName: https
  hostnames:
    - "${ALB_FQDN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: demo-app
          port: 80
