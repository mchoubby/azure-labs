apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-ingress
  namespace: demo-app
  annotations:
    alb.networking.azure.io/alb-id: "${ALB_ID}"
spec:
  gatewayClassName: azure-alb-external
  addresses:
    - type: alb.networking.azure.io/alb-frontend
      value: "${ALB_FRONTEND_NAME}"
  listeners:
    - name: http
      hostname: "${ALB_FQDN}"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: "${ALB_FQDN}"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: demo-ingress-tls
      allowedRoutes:
        namespaces:
          from: Same
